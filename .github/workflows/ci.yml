
name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit-tests:
    name: Python Unit & Live Postgres Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: olist_dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olist_dwh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TGT_DB_HOST: localhost
      TGT_DB_PORT: 5432
      TGT_DB_USER: postgres
      TGT_DB_PASSWORD: postgres_ci_password
      TGT_DB_NAME: olist_dwh
      TGT_DB_SCHEMA: bronze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Live Postgres Integration Tests
        run: |
          python -m unittest discover -s tests -v

  dbt-validation:
    name: dbt Medallion Build & Live Postgres Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: olist_dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olist_dwh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TGT_DB_HOST: localhost
      TGT_DB_PORT: 5432
      TGT_DB_USER: postgres
      TGT_DB_PASSWORD: postgres_ci_password
      TGT_DB_NAME: olist_dwh
      TGT_DB_SCHEMA: bronze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dbt & Postgres Client
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres==1.11.0 psycopg2-binary sqlalchemy python-dotenv pyyaml

      - name: Bootstrap Bronze Schema in PostgreSQL 16
        run: |
          python -c "
          import pathlib, psycopg2
          ddl = pathlib.Path('sql/raw/raw_table.sql').read_text(encoding='utf-8').replace('{schema}', 'bronze')
          conn = psycopg2.connect(host='localhost', port=5432, user='postgres', password='postgres_ci_password', dbname='olist_dwh')
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(ddl)
          conn.close()
          print('Bootstrapped bronze & monitoring schemas in Postgres 16.')
          "

      - name: Build, Test & Collect Errors on Live PostgreSQL 16
        run: |
          RUN_ID="ci_${GITHUB_RUN_ID:-local}"
          (cd dbt_transform && dbt deps && dbt parse --no-partial-parse)
          (cd dbt_transform && dbt test --select source:* --target-path /tmp/dbt_test_bronze_source)
          python -m src.monitoring.collect_errors --collect --quality-gate --layer bronze --run-id "$RUN_ID" --target-dir /tmp/dbt_test_bronze_source
          (cd dbt_transform && dbt run --select staging --full-refresh)
          (cd dbt_transform && dbt test --select staging --exclude source:* --target-path /tmp/dbt_test_silver)
          python -m src.monitoring.collect_errors --collect --quality-gate --layer silver --run-id "$RUN_ID" --target-dir /tmp/dbt_test_silver
          (cd dbt_transform && dbt snapshot)
          (cd dbt_transform && dbt run --select marts --full-refresh)
          (cd dbt_transform && dbt test --select marts,test_type:generic --target-path /tmp/dbt_test_gold_schema)
          (cd dbt_transform && dbt test --select test_type:singular --target-path /tmp/dbt_test_business_rules)
          python -m src.monitoring.collect_errors --collect --quality-gate --layer gold --run-id "$RUN_ID" --target-dir /tmp/dbt_test_gold_schema /tmp/dbt_test_business_rules

  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: airflow/Dockerfile
          push: false

